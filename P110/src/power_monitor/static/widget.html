<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P110 · Consumo</title>
  <link rel="stylesheet" href="/static/widget.css">
</head>
<body data-state="loading" data-view="chart">
  <main class="widget">
    <header class="head">
      <h1 class="head__name">Tapo&nbsp;P110</h1>

      <div class="head__tools">
        <button id="view-toggle" class="ghost" type="button" aria-pressed="false">
          tabla
        </button>
        <span class="status">
          <span class="status__dot" aria-hidden="true"></span>
          <span id="status-text">···</span>
        </span>
      </div>
    </header>

    <section class="hero">
      <p class="hero__row">
        <span class="hero__value" id="power">--</span>
        <span class="hero__unit">W</span>
      </p>
      <p class="hero__meta" id="hero-meta">esperando lectura</p>
    </section>

    <figure class="plot">
      <figcaption class="plot__caption">
        <span>Potencia · últimos 10 min</span>
        <span class="plot__peak" id="peak"></span>
      </figcaption>

      <div class="plot__frame">
        <canvas id="chart" tabindex="0" role="img"
                aria-label="Potencia instantánea de los últimos 10 minutos"></canvas>
        <div class="tip" id="tip" hidden>
          <span class="tip__value" id="tip-value"></span>
          <span class="tip__time" id="tip-time"></span>
        </div>
        <p class="plot__empty" id="plot-empty">recopilando muestras</p>
      </div>

      <div class="plot__axis">
        <span id="axis-start">-10 min</span>
        <span>ahora</span>
      </div>
    </figure>

    <div class="tableview" id="tableview" hidden>
      <table>
        <caption class="sr-only">Lecturas de potencia de los últimos 10 minutos</caption>
        <thead>
          <tr><th scope="col">Hora</th><th scope="col">Potencia</th></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div class="metrics">
      <div class="metric">
        <span class="metric__label">Hoy</span>
        <span class="metric__value" id="today-kwh">--</span>
      </div>
      <div class="metric">
        <span class="metric__label">Coste hoy</span>
        <span class="metric__value" id="today-cost">--</span>
      </div>
      <div class="metric">
        <span class="metric__label">Mes</span>
        <span class="metric__value" id="month-kwh">--</span>
      </div>
      <div class="metric">
        <span class="metric__label">Coste mes</span>
        <span class="metric__value" id="month-cost">--</span>
      </div>
      <div class="metric metric--wide">
        <span class="metric__label">Activo hoy</span>
        <span class="metric__value" id="runtime">--</span>
      </div>
    </div>
  </main>

  <script src="/static/widget.js"></script>
</body>
</html>
